name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and example dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[examples]'
      - name: Execute deterministic example notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          path = Path("examples/game_onboarding.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(
              notebook,
              timeout=600,
              kernel_name="python3",
              resources={"metadata": {"path": str(path.parent)}},
          ).execute()
          PY
